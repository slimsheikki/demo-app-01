<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Annotation Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
  <style>
    /* ── Reset & tokens ── */
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg0:#111;--bg1:#1c1c1e;--bg2:#282828;--bg3:#333;
      --bd:#2c2c2e;--txt:#d0d0d0;--txt2:#666;--acc:#0a84ff;
      --canvas-bg:#444;
    }
    body{
      background:var(--bg0);color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
      user-select:none;font-size:11px;
    }

    /* ── Menu bar ── */
    #menubar{
      height:28px;background:var(--bg1);border-bottom:1px solid var(--bd);
      display:flex;align-items:center;padding:0 8px;gap:6px;flex-shrink:0;
    }
    #apptitle{font-size:12px;font-weight:600;color:var(--txt2);letter-spacing:.04em;flex:1;white-space:nowrap}
    .mbtn{
      background:var(--bg2);border:1px solid var(--bd);border-radius:3px;
      color:var(--txt);cursor:pointer;font-size:11px;padding:3px 9px;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap;
      flex-shrink:0;
    }
    .mbtn:hover{background:var(--bg3)}
    .mbtn:active{border-color:var(--acc)}
    #openBtn{background:var(--acc);border-color:var(--acc);color:#fff}
    #openBtn:hover{background:#005bbf;border-color:#005bbf}

    /* ── Options bar (below canvas) ── */
    #optbar{
      height:36px;background:var(--bg1);border-top:1px solid var(--bd);
      display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0;
      overflow-x:auto;-webkit-overflow-scrolling:touch;
    }
    .swatch{
      width:22px;height:22px;border-radius:50%;cursor:pointer;
      border:2px solid transparent;flex-shrink:0;touch-action:manipulation;
    }
    .swatch.on{border-color:#fff}
    .swatch:not(.on):hover{border-color:var(--txt2)}
    #cpick{
      width:20px;height:20px;border-radius:3px;border:1px solid var(--bd);
      cursor:pointer;padding:0;background:none;flex-shrink:0;
    }
    .osep{width:1px;height:18px;background:var(--bd);flex-shrink:0;margin:0 3px}
    .olbl{color:var(--txt2);font-size:10px;letter-spacing:.04em;flex-shrink:0}
    #swid,#sopa{accent-color:var(--acc);flex-shrink:0;cursor:pointer}
    #swid{width:72px}
    #sopa{width:60px}
    .oval{
      color:var(--txt);font-size:10px;min-width:20px;text-align:right;
      flex-shrink:0;font-variant-numeric:tabular-nums;
    }

    /* ── Workspace ── */
    #workspace{display:flex;flex:1;overflow:hidden;min-height:0}

    /* ── Tool panel (hidden — tools live in bottom strip) ── */
    #toolpanel{display:none}
    .tbtn{
      background:transparent;border:1px solid transparent;
      border-radius:8px;color:var(--txt2);cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent;
      position:relative;flex-shrink:0;
    }
    .tbtn:hover{background:var(--bg2);color:var(--txt)}
    .tbtn svg{pointer-events:none}

    /* ── Canvas area ── */
    #cwrap{
      flex:1;overflow:hidden;background:var(--canvas-bg);
      display:flex;align-items:center;justify-content:center;position:relative;
    }

    /* ── Drop zone ── */
    #dz{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;color:var(--txt2);
      gap:8px;cursor:pointer;
    }
    #dz .ico{font-size:44px;opacity:.4}
    #dz .dzlabel{font-size:13px}
    #dz .dzsub{font-size:11px;color:#4a4a4a}
    #dz.hide{display:none}

    /* ── Feedback overlays ── */
    #errmsg{
      position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
      background:#a02020;color:#fff;padding:6px 14px;border-radius:4px;
      font-size:12px;display:none;z-index:99;white-space:nowrap;pointer-events:none;
    }
    #loadmsg{
      position:absolute;inset:0;display:none;align-items:center;
      justify-content:center;background:rgba(0,0,0,.5);
      font-size:13px;color:var(--txt);z-index:98;
    }

    /* ── Text input overlay ── */
    #txtwrap{position:absolute;display:none;z-index:50}
    #txtin{
      background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.28);
      border-radius:3px;color:#fff;outline:none;
      padding:3px 6px;min-width:100px;font-family:sans-serif;
    }

    /* ── Layers bar (horizontal bottom strip) ── */
    #panels{
      width:100%;height:44px;background:var(--bg1);
      border-top:1px solid var(--bd);
      display:flex;flex-direction:row;flex-shrink:0;
    }
    #lhdr{
      padding:0 10px;border-right:1px solid var(--bd);
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      font-size:10px;font-weight:700;color:var(--txt2);
      text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;white-space:nowrap;
    }
    #addL{
      background:var(--bg2);border:1px solid var(--bd);border-radius:3px;
      color:var(--txt);cursor:pointer;font-size:14px;line-height:1;
      padding:0 5px 1px;touch-action:manipulation;
    }
    #addL:hover{background:var(--bg3);color:#fff}
    #ll{
      flex:1;display:flex;flex-direction:row;align-items:center;
      overflow-x:auto;overflow-y:hidden;padding:0 6px;gap:4px;
    }
    #ll::-webkit-scrollbar{height:3px}
    #ll::-webkit-scrollbar-track{background:var(--bg1)}
    #ll::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
    .lr{
      height:30px;display:flex;align-items:center;gap:6px;
      padding:0 14px;cursor:pointer;border:1px solid transparent;border-radius:20px;
      touch-action:manipulation;-webkit-tap-highlight-color:transparent;
      position:relative;flex-shrink:0;white-space:nowrap;
    }
    .lr.on{background:var(--bg3);border-color:var(--bd)}
    .lr.on::before{
      content:'';position:absolute;left:6px;right:6px;bottom:0;
      height:2px;background:var(--acc);border-radius:1px 1px 0 0;
    }
    .lr:not(.on):hover{background:var(--bg2)}
    .lvis{
      background:none;border:none;color:var(--txt2);cursor:pointer;
      padding:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      touch-action:manipulation;width:18px;height:18px;
    }
    .lvis:hover{color:var(--txt)}
    .lvis.off{color:#444}
    .lnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}

    /* ── Tool strip (always visible, bottom) ── */
    #toolstrip{
      display:flex;height:76px;background:var(--bg1);
      border-top:1px solid var(--bd);
      flex-shrink:0;align-items:center;justify-content:center;
      padding:0 8px;gap:2px;
    }
    #toolstrip .tbtn{
      width:50px;height:66px;border-radius:12px;flex-shrink:0;
      flex-direction:column;gap:5px;
    }
    #toolstrip .tbtn.on{background:#e8e8e8;border-color:transparent;color:#111}
    #toolstrip .tbtn.on::before{display:none}
    .tlbl{font-size:9px;letter-spacing:.02em;font-weight:500;color:var(--txt2);line-height:1;pointer-events:none}
    #toolstrip .tbtn.on .tlbl{color:#333}

    /* ── Status bar ── */
    #statusbar{
      height:20px;background:var(--bg0);border-top:1px solid var(--bd);
      display:flex;align-items:center;padding:0 8px;
      justify-content:space-between;flex-shrink:0;
    }
    #statusbar span{font-size:10px;color:var(--txt2)}

    #statusbar{display:none}

    @media(max-width:480px){
      #toolstrip{gap:0;padding:0 4px}
      #toolstrip .tbtn{width:44px;height:62px}
      #swid{width:52px}
      #sopa{width:44px}
    }
  </style>
</head>
<body>

<!-- ── Menu bar ── -->

  <!-- Left tool panel -->

<div id="panels">

<div id="optbar">

<!-- ── Status bar ── -->

  <span id="statusTool">Pencil</span>
  <span id="statusDims"></span>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let tool = 'pencil', color = '#ff3b30', sw = 3, opacity = 1, fontSize = 22;
let layers = [], activeId = null, shapeMap = {};
let undoStack = [], MAX_UNDO = 50;
let stage = null, imgLayer = null, drawLayer = null, trLayer = null, tr = null;
let imgW = 0, imgH = 0;
let drawing = false, anchor = {x:0,y:0}, pts = [], mc = 0;
let curNode = null, curData = null;
let selNode = null;
let txtPos = null;
const ERASE_R = 24;

const TOOL_NAMES = {select:'Select',pencil:'Pencil',rectangle:'Rectangle',ellipse:'Ellipse',arrow:'Arrow',text:'Text',eraser:'Eraser'};

// ── Helpers ────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,10);

function getPos() {
  if (!stage) return null;
  const p = stage.getPointerPosition();
  if (!p) return null;
  const s = stage.scaleX();
  return {x: p.x/s, y: p.y/s};
}

function activeLayer() { return layers.find(l => l.id === activeId); }
function activeKL()    { return activeLayer()?.kl ?? null; }

// ── Stage Init ─────────────────────────────────────────────────────────────
function initStage(w, h) {
  if (stage) stage.destroy();
  const wrap = document.getElementById('cwrap');
  const sc = Math.min(wrap.clientWidth / w, wrap.clientHeight / h, 1);

  stage = new Konva.Stage({container:'kc', width: w*sc, height: h*sc, scaleX: sc, scaleY: sc});

  imgLayer = new Konva.Layer({listening:false});
  stage.add(imgLayer);

  layers.forEach(l => {
    l.kl = new Konva.Layer();
    stage.add(l.kl);
    Object.values(shapeMap).filter(s=>s.lid===l.id).forEach(s => addNodeFromData(s, l.kl));
    l.kl.listening(l.id === activeId);
  });

  drawLayer = new Konva.Layer({listening:false});
  trLayer   = new Konva.Layer();
  tr = new Konva.Transformer({rotateEnabled:false, boundBoxFunc:(_,nb)=>nb});
  trLayer.add(tr);
  stage.add(drawLayer);
  stage.add(trLayer);

  tr.on('transformend', onTransformEnd);

  stage.on('mousedown touchstart',  onDown);
  stage.on('mousemove touchmove',   onMove);
  stage.on('mouseup touchend mouseleave', onUp);
}

// ── Image Loading ──────────────────────────────────────────────────────────
function showErr(msg) {
  const el = document.getElementById('errmsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

function loadFile(file) {
  if (!file) return;
  const loadEl = document.getElementById('loadmsg');
  loadEl.style.display = 'flex';

  const reader = new FileReader();
  reader.onerror = () => { loadEl.style.display='none'; showErr('Could not read file.'); };
  reader.onload = (ev) => {
    const dataUrl = ev.target.result;
    const img = new Image();
    img.onerror = () => { loadEl.style.display='none'; showErr('Image format not supported by this browser.'); };
    img.onload = () => {
      loadEl.style.display = 'none';
      imgW = img.naturalWidth || img.width;
      imgH = img.naturalHeight || img.height;
      if (!imgW || !imgH) { showErr('Could not read image dimensions.'); return; }
      shapeMap = {}; layers = []; undoStack = []; selNode = null; activeId = null;
      document.getElementById('dz').classList.add('hide');
      document.getElementById('statusDims').textContent = imgW + ' × ' + imgH;
      // rAF lets the browser finish the layout pass (hiding #dz, settling flex heights)
      // before we measure cwrap.clientWidth/clientHeight in initStage
      requestAnimationFrame(() => {
        initStage(imgW, imgH);
        imgLayer.add(new Konva.Image({image:img, x:0, y:0, width:imgW, height:imgH}));
        imgLayer.draw();
        addLayer('Layer 1');
      });
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
}

// ── Layer Management ───────────────────────────────────────────────────────
function addLayer(name) {
  if (!stage) return;
  const id = uid();
  const kl = new Konva.Layer();
  stage.add(kl);
  drawLayer.moveToTop(); trLayer.moveToTop();
  const meta = {id, name: name || `Layer ${layers.length+1}`, visible:true, kl};
  layers.push(meta);
  setActive(id);
}

function setActive(id) {
  clearSel();
  activeId = id;
  layers.forEach(l => l.kl.listening(l.id === id));
  renderLayers();
}

function toggleVis(id) {
  const l = layers.find(l=>l.id===id);
  if (!l) return;
  l.visible = !l.visible;
  l.kl.visible(l.visible);
  l.kl.draw();
  renderLayers();
}

function renderLayers() {
  const ll = document.getElementById('ll');
  ll.innerHTML = '';
  [...layers].reverse().forEach(l => {
    const row = document.createElement('div');
    row.className = 'lr' + (l.id===activeId?' on':'');

    const vis = document.createElement('button');
    vis.className = 'lvis' + (l.visible?'':' off');
    vis.title = l.visible ? 'Hide layer' : 'Show layer';
    vis.innerHTML = l.visible
      ? '<svg width="14" height="14"><use href="#ico-eye-on"/></svg>'
      : '<svg width="14" height="14"><use href="#ico-eye-off"/></svg>';
    vis.onclick = e => { e.stopPropagation(); toggleVis(l.id); };

    const nm = document.createElement('div');
    nm.className = 'lnm';
    nm.textContent = l.name;

    row.append(vis, nm);
    row.onclick = () => setActive(l.id);
    ll.appendChild(row);
  });
}

// ── Shape Node Building ────────────────────────────────────────────────────
function buildNode(s) {
  const c = {id:s.id, opacity:s.op??1, strokeScaleEnabled:false};
  switch(s.type) {
    case 'pencil':    return new Konva.Line({...c, points:s.pts, stroke:s.col, strokeWidth:s.sw, tension:.5, lineCap:'round', lineJoin:'round'});
    case 'rectangle': return new Konva.Rect({...c, x:s.x, y:s.y, width:s.w, height:s.h, stroke:s.col, strokeWidth:s.sw, fill:'transparent'});
    case 'ellipse':   return new Konva.Ellipse({...c, x:s.x, y:s.y, radiusX:s.rx, radiusY:s.ry, stroke:s.col, strokeWidth:s.sw, fill:'transparent'});
    case 'arrow':     return new Konva.Arrow({...c, points:s.pts, stroke:s.col, strokeWidth:s.sw, fill:s.col, pointerLength:12, pointerWidth:10});
    case 'text':      return new Konva.Text({...c, x:s.x, y:s.y, text:s.txt, fontSize:s.fs, fontFamily:'sans-serif', fill:s.col});
    default: return null;
  }
}

function addNodeFromData(s, kl) {
  const node = buildNode(s);
  if (!node) return;
  kl.add(node);
  node.on('click tap', () => { if (tool==='select') pickNode(node, s.id); });
  return node;
}

function commitShape(data) {
  shapeMap[data.id] = data;
  const kl = activeKL();
  if (!kl) return;
  addNodeFromData(data, kl);
  kl.draw();
}

// ── Select / Transform ─────────────────────────────────────────────────────
function clearSel() {
  if (selNode) { selNode.draggable(false); }
  tr?.nodes([]);
  selNode = null;
  trLayer?.draw();
}

function pickNode(node, id) {
  clearSel();
  selNode = node;
  const s = shapeMap[id];
  if (!s) return;
  node.draggable(true);
  if (s.type==='rectangle'||s.type==='ellipse') tr.nodes([node]);
  else tr.nodes([]);
  trLayer.draw();

  node.on('dragend.sel', () => {
    if (!shapeMap[id]) return;
    if (s.type==='text'||s.type==='rectangle'||s.type==='ellipse') {
      shapeMap[id] = {...shapeMap[id], x:node.x(), y:node.y()};
    }
  });
}

function onTransformEnd() {
  tr.nodes().forEach(node => {
    const id = node.id();
    const s = shapeMap[id];
    if (!s) return;
    if (s.type==='rectangle') {
      shapeMap[id] = {...s, x:node.x(), y:node.y(), w:node.width()*node.scaleX(), h:node.height()*node.scaleY()};
    } else if (s.type==='ellipse') {
      shapeMap[id] = {...s, x:node.x(), y:node.y(), rx:(node.width()*node.scaleX())/2, ry:(node.height()*node.scaleY())/2};
    }
    node.scaleX(1); node.scaleY(1);
  });
}

// ── Drawing ────────────────────────────────────────────────────────────────
function onDown(e) {
  if (!stage || !activeId) return;
  const al = activeLayer();
  if (!al || !al.visible) return;
  const pos = getPos();
  if (!pos) return;

  if (tool==='select') {
    if (e.target===stage||e.target===imgLayer.getChildren()[0]) clearSel();
    return;
  }
  if (tool==='text') { showText(pos); return; }
  if (tool==='eraser') { saveUndo(); eraseAt(pos); drawing=true; return; }

  saveUndo();
  drawing=true; anchor={...pos}; pts=[pos.x,pos.y]; mc=0;
  const id=uid(), base={id, lid:activeId, col:color, sw, op:opacity};

  switch(tool) {
    case 'pencil':
      curData={...base,type:'pencil',pts:[pos.x,pos.y]};
      curNode=new Konva.Line({id,stroke:color,strokeWidth:sw,tension:.5,lineCap:'round',lineJoin:'round',points:[pos.x,pos.y],strokeScaleEnabled:false,opacity});
      break;
    case 'rectangle':
      curData={...base,type:'rectangle',x:pos.x,y:pos.y,w:0,h:0};
      curNode=new Konva.Rect({id,x:pos.x,y:pos.y,width:0,height:0,stroke:color,strokeWidth:sw,fill:'transparent',strokeScaleEnabled:false,opacity});
      break;
    case 'ellipse':
      curData={...base,type:'ellipse',x:pos.x,y:pos.y,rx:0,ry:0};
      curNode=new Konva.Ellipse({id,x:pos.x,y:pos.y,radiusX:0,radiusY:0,stroke:color,strokeWidth:sw,fill:'transparent',strokeScaleEnabled:false,opacity});
      break;
    case 'arrow':
      curData={...base,type:'arrow',pts:[pos.x,pos.y,pos.x,pos.y]};
      curNode=new Konva.Arrow({id,points:[pos.x,pos.y,pos.x,pos.y],stroke:color,strokeWidth:sw,fill:color,pointerLength:12,pointerWidth:10,strokeScaleEnabled:false,opacity});
      break;
  }
  if (curNode) { drawLayer.add(curNode); drawLayer.draw(); }
}

function onMove(e) {
  if (!drawing) return;
  const pos = getPos();
  if (!pos) return;

  if (tool==='eraser') { eraseAt(pos); return; }
  if (!curNode||!curData) return;
  mc++;

  if (tool==='pencil') {
    if (mc%2===0) { pts.push(pos.x,pos.y); curNode.points([...pts]); curData.pts=[...pts]; }
  } else if (tool==='rectangle') {
    const x=Math.min(anchor.x,pos.x), y=Math.min(anchor.y,pos.y);
    const w=Math.abs(pos.x-anchor.x), h=Math.abs(pos.y-anchor.y);
    curNode.x(x);curNode.y(y);curNode.width(w);curNode.height(h);
    Object.assign(curData,{x,y,w,h});
  } else if (tool==='ellipse') {
    const rx=Math.abs(pos.x-anchor.x), ry=Math.abs(pos.y-anchor.y);
    curNode.radiusX(rx);curNode.radiusY(ry);
    Object.assign(curData,{rx,ry});
  } else if (tool==='arrow') {
    curNode.points([anchor.x,anchor.y,pos.x,pos.y]);
    curData.pts=[anchor.x,anchor.y,pos.x,pos.y];
  }
  drawLayer.draw();
}

function onUp() {
  if (!drawing) return;
  drawing=false;
  if (tool==='eraser') return;
  if (!curNode||!curData) { curNode=null;curData=null; return; }

  let ok=true;
  const s=curData;
  if (s.type==='pencil'&&s.pts.length<4) ok=false;
  if (s.type==='rectangle'&&(s.w<2||s.h<2)) ok=false;
  if (s.type==='ellipse'&&(s.rx<2||s.ry<2)) ok=false;
  if (s.type==='arrow'&&Math.abs(s.pts[2]-s.pts[0])<2&&Math.abs(s.pts[3]-s.pts[1])<2) ok=false;

  curNode.remove(); drawLayer.draw();
  if (ok) commitShape(curData);
  curNode=null; curData=null;
}

// ── Eraser ─────────────────────────────────────────────────────────────────
function bbox(s) {
  if (s.type==='rectangle') return {x:s.x,y:s.y,w:s.w,h:s.h};
  if (s.type==='ellipse')   return {x:s.x-s.rx,y:s.y-s.ry,w:s.rx*2,h:s.ry*2};
  if (s.type==='arrow')     return {x:Math.min(s.pts[0],s.pts[2]),y:Math.min(s.pts[1],s.pts[3]),w:Math.abs(s.pts[2]-s.pts[0]),h:Math.abs(s.pts[3]-s.pts[1])};
  if (s.type==='text')      return {x:s.x,y:s.y,w:s.fs*(s.txt?.length||1)*.6,h:s.fs};
  return {x:0,y:0,w:0,h:0};
}

function eraseAt(pos) {
  const r=ERASE_R, kl=activeKL();
  if (!kl) return;
  Object.values(shapeMap).filter(s=>s.lid===activeId).forEach(s=>{
    let hit=false;
    if (s.type==='pencil') {
      for (let i=0;i<s.pts.length;i+=2){const dx=s.pts[i]-pos.x,dy=s.pts[i+1]-pos.y;if(dx*dx+dy*dy<=r*r){hit=true;break;}}
    } else {
      const b=bbox(s);
      hit=pos.x>=b.x-r&&pos.x<=b.x+b.w+r&&pos.y>=b.y-r&&pos.y<=b.y+b.h+r;
    }
    if (hit) {
      delete shapeMap[s.id];
      kl.findOne('#'+s.id)?.destroy();
    }
  });
  kl.draw();
}

// ── Text ───────────────────────────────────────────────────────────────────
function showText(pos) {
  txtPos = pos;
  const wrap=document.getElementById('txtwrap'), inp=document.getElementById('txtin');
  const sb=stage.container().getBoundingClientRect(), cb=document.getElementById('cwrap').getBoundingClientRect();
  const sc=stage.scaleX();
  wrap.style.display='block';
  wrap.style.left=(sb.left-cb.left+pos.x*sc)+'px';
  wrap.style.top=(sb.top-cb.top+pos.y*sc)+'px';
  inp.style.fontSize=(fontSize*sc)+'px';
  inp.style.color=color;
  inp.value='';
  requestAnimationFrame(()=>inp.focus());
}

function commitText() {
  const inp=document.getElementById('txtin');
  const txt=inp.value.trim();
  document.getElementById('txtwrap').style.display='none';
  if (!txt||!txtPos) { txtPos=null; return; }
  saveUndo();
  const id=uid();
  commitShape({id,lid:activeId,type:'text',x:txtPos.x,y:txtPos.y,txt,fs:fontSize,col:color,sw:0,op:opacity});
  txtPos=null;
}

document.getElementById('txtin').addEventListener('keydown', e=>{
  if (e.key==='Enter'){e.preventDefault();commitText();}
  if (e.key==='Escape'){document.getElementById('txtwrap').style.display='none';txtPos=null;}
});
document.getElementById('txtin').addEventListener('blur', commitText);

// ── Undo ───────────────────────────────────────────────────────────────────
function saveUndo() {
  undoStack.push({
    shapes: JSON.stringify(shapeMap),
    layers: layers.map(l=>({id:l.id,name:l.name,visible:l.visible})),
    activeId,
  });
  if (undoStack.length>MAX_UNDO) undoStack.shift();
}

function undo() {
  if (!undoStack.length||!stage) return;
  const snap=undoStack.pop();
  shapeMap=JSON.parse(snap.shapes);
  activeId=snap.activeId;
  clearSel();

  snap.layers.forEach(meta=>{
    const l=layers.find(l=>l.id===meta.id);
    if (!l) return;
    l.visible=meta.visible;
    l.kl.visible(l.visible);
    l.kl.destroyChildren();
    Object.values(shapeMap).filter(s=>s.lid===l.id).forEach(s=>addNodeFromData(s,l.kl));
    l.kl.draw();
  });

  layers.forEach(l=>l.kl.listening(l.id===activeId));
  renderLayers();
}

// ── UI Wiring ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tbtn[data-tool]').forEach(b=>{
  b.addEventListener('click',()=>{
    tool=b.dataset.tool;
    document.querySelectorAll('.tbtn[data-tool]').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll(`.tbtn[data-tool="${tool}"]`).forEach(x=>x.classList.add('on'));
    if (tool!=='select') clearSel();
    const curs={pencil:'crosshair',rectangle:'crosshair',ellipse:'crosshair',arrow:'crosshair',text:'text',select:'default',eraser:'cell'};
    if (stage) stage.container().style.cursor=curs[tool]||'crosshair';
    document.getElementById('statusTool').textContent = TOOL_NAMES[tool]||tool;
  });
});

document.querySelectorAll('.swatch').forEach(s=>{
  s.addEventListener('click',()=>{
    color=s.dataset.c;
    document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));
    s.classList.add('on');
    document.getElementById('cpick').value=color;
    document.getElementById('fgswatch').style.background=color;
  });
});

document.getElementById('cpick').addEventListener('input',e=>{
  color=e.target.value;
  document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('on'));
  document.getElementById('fgswatch').style.background=color;
});

document.getElementById('swid').addEventListener('input',e=>{
  sw=+e.target.value;
  document.getElementById('swval').textContent=sw;
});

document.getElementById('sopa').addEventListener('input',e=>{
  opacity=+e.target.value/100;
  document.getElementById('opval').textContent=Math.round(opacity*100)+'%';
});

document.getElementById('fgswatch').addEventListener('click',()=>{
  document.getElementById('cpick').click();
});

document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('addL').addEventListener('click',()=>{ if(stage) addLayer(); });

document.getElementById('openBtn').addEventListener('click',()=>document.getElementById('fi').click());
document.getElementById('fi').addEventListener('change',e=>{
  const f=e.target.files?.[0]; if(f) loadFile(f); e.target.value='';
});

const cwrap=document.getElementById('cwrap');
cwrap.addEventListener('dragover',e=>e.preventDefault());
cwrap.addEventListener('drop',e=>{ e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
document.getElementById('dz').addEventListener('click',()=>document.getElementById('fi').click());

document.addEventListener('keydown',e=>{
  if ((e.metaKey||e.ctrlKey)&&e.key==='z'){ e.preventDefault(); undo(); return; }
  if (e.target.tagName==='INPUT') return;
  const map={v:'select',p:'pencil',r:'rectangle',e:'ellipse',a:'arrow',t:'text',x:'eraser'};
  if (!e.metaKey&&!e.ctrlKey&&map[e.key]) { document.querySelector(`[data-tool="${map[e.key]}"]`)?.click(); return; }
  if ((e.key==='Delete'||e.key==='Backspace')&&selNode&&tool==='select') {
    const id=selNode.id();
    if (id&&shapeMap[id]) { saveUndo(); delete shapeMap[id]; selNode.destroy(); selNode=null; tr.nodes([]); activeKL()?.draw(); }
  }
});

// ── Resize stage on window resize ─────────────────────────────────────────
window.addEventListener('resize',()=>{
  if (!stage||!imgW) return;
  const wrap=document.getElementById('cwrap');
  const sc=Math.min(wrap.clientWidth/imgW,wrap.clientHeight/imgH,1);
  stage.width(imgW*sc); stage.height(imgH*sc);
  stage.scaleX(sc); stage.scaleY(sc);
  stage.draw();
});
</script>
</body>
</html>
